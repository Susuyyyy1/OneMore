# XcodeGen 配置：运行 ./generate.sh 生成 OneMore.xcodeproj
# 不要直接改 .xcodeproj（会被重新生成覆盖），改这个文件即可。
name: OneMore
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(ONEMORE_TEAM)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  OneMore:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    entitlements:
      path: iOS/OneMore.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_NAME: OneMore
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).onemore
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: One More
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHealthShareUsageDescription: 读取训练期间的心率和活动能量，用于显示训练总结。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 把力量训练保存到“健康”，计入活动圆环。
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    dependencies:
      - target: OneMoreWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
      - target: OneMoreWidgets
        embed: true

  # 小组件扩展：组间休息的实时活动（灵动岛 + 锁屏倒计时）
  OneMoreWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: iOS/LiveActivity/RestActivityAttributes.swift
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: OneMoreWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).onemore.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: One More
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  OneMoreWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    info:
      path: Watch/Info.plist
      properties:
        WKBackgroundModes:
          - workout-processing
    entitlements:
      path: Watch/OneMoreWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_NAME: OneMoreWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).onemore.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: One More
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).onemore
        INFOPLIST_KEY_NSHealthShareUsageDescription: 读取训练期间的心率和活动能量，用于显示训练总结。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 把力量训练保存到“健康”，计入活动圆环。
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  OneMoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OneMore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).onemore.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OneMore:
    build:
      targets:
        OneMore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OneMoreTests
  OneMoreWatch:
    build:
      targets:
        OneMoreWatch: all
    run:
      config: Debug
